name: deploy

on:
  workflow_dispatch:
    inputs:
      image-name:
        description: 'Image name'
        default: 'ghcr.io/altimetrik-digital-enablement-demo-hub/sample-python'
        required: true
        type: string
      image-tag:
        description: 'Image tag'
        default: 'latest'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace'
        default: 'sample-python'
        required: true
        type: string
      release-name:
        description: 'Helm release name'
        default: 'sample-python'
        required: true
        type: string
      registry:
        description: 'Container registry'
        required: false
        type: string
        default: 'ghcr.io'
      chart:
        description: 'Chart path'
        required: false
        type: string
        default: 'deploy/helm/sample-python'
      target:
        description: "Deployment platform"
        required: false
        default: 'local-k8s'
        type: choice 
        options:
          - 'local-k8s' 

permissions:
  actions: read
  contents: write
  security-events: write
  packages: write
  
jobs:
  deploy:
    uses: altimetrik-digital-enablement-demo-hub/platform-github-actions/.github/workflows/python-deploy.yml@v0.0.1
    with:
      image-name: ${{ inputs.image-name }}
      image-tag: ${{ inputs.image-tag }}
      namespace: ${{ inputs.namespace }}
      registry: ${{ inputs.registry }}
      chart: ${{ inputs.chart }}
      release-name: ${{ inputs.release-name }}
      target: ${{ inputs.target }}
    secrets: inherit
