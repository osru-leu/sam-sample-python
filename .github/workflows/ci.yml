name: build

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:
    types:
      - opened
      - reopened
      - edited
    branches:
      - main
  workflow_dispatch:
 
permissions:
  actions: read
  contents: write
  security-events: write
  packages: write

jobs:
  build:
    uses: altimetrik-digital-enablement-demo-hub/platform-github-actions/.github/workflows/python-build.yml@v1
    with:
      python-version: '3.11'
      working-directory: '.'
      lint-command: 'pylint app run.py test'
      test-command: 'python -m unittest discover -s test -t .' 
      app-name: 'sample-python-test'
