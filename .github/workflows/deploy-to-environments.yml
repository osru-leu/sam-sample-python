name: Deploy Sample Python App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev-int
          - future
          - active
          - uat
          - staging
          - prod
      release_type:
        description: 'Release type'
        required: false
        type: choice
        options:
          - future
          - active
          - standard
  push:
    branches:
      - main

jobs:
  # Build and test before deployment
  build-and-test:
    name: Build & Test Python App
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest test/ --cov=app --cov-report=term-missing

      - name: Generate version
        id: version
        run: |
          VERSION="v1.0.0-${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

  # Use deployment lifecycle validation from test-flow
  deployment-lifecycle-validation:
    name: Deployment Lifecycle Validation
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    outputs:
      is_valid: ${{ steps.validate.outputs.is_valid }}
    steps:
      - name: Run Deployment Lifecycle Validation
        id: validate
        uses: osru-leu/test-flow/.github/actions/deployment-lifecycle-validation@main
        with:
          environment: ${{ inputs.environment }}
          branch: ${{ github.ref_name }}

      - name: Validation Result
        run: |
          echo "Validation result: ${{ steps.validate.outputs.is_valid }}"
          if [[ "${{ steps.validate.outputs.is_valid }}" != "true" ]]; then
            echo "::error::Deployment lifecycle validation failed"
            exit 1
          fi

  # Use branch validation from test-flow
  branch-validation:
    name: Branch Validation
    runs-on: ubuntu-latest
    needs: deployment-lifecycle-validation
    if: github.event_name == 'workflow_dispatch'
    outputs:
      is_valid: ${{ steps.validate-branch.outputs.is_valid }}
    steps:
      - name: Run Branch Validation
        id: validate-branch
        uses: osru-leu/test-flow/.github/actions/branch-validation@main
        with:
          branch: ${{ github.ref_name }}
          environment: ${{ inputs.environment }}

      - name: Branch Validation Result
        run: |
          echo "Branch validation: ${{ steps.validate-branch.outputs.is_valid }}"
          if [[ "${{ steps.validate-branch.outputs.is_valid }}" != "true" ]]; then
            echo "::error::Branch validation failed"
            exit 1
          fi

  # Use release check from test-flow
  release-check:
    name: Future or Active Release Check
    runs-on: ubuntu-latest
    needs: branch-validation
    if: github.event_name == 'workflow_dispatch' && (inputs.environment == 'future' || inputs.environment == 'active')
    outputs:
      is_valid: ${{ steps.check-release.outputs.is_valid }}
      release_id: ${{ steps.check-release.outputs.release_id }}
    steps:
      - name: Check Release Status
        id: check-release
        uses: osru-leu/test-flow/.github/actions/release-check@main
        with:
          release_type: ${{ inputs.release_type || 'standard' }}
          environment: ${{ inputs.environment }}

      - name: Release Check Result
        run: |
          echo "Release check: ${{ steps.check-release.outputs.is_valid }}"
          if [[ "${{ steps.check-release.outputs.is_valid }}" != "true" ]]; then
            echo "::error::Release check failed"
            exit 1
          fi

  # Build Docker image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, branch-validation]
    if: always() && (needs.branch-validation.result == 'success' || github.event_name == 'push')
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sample-python
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image built successfully
        run: |
          echo "Docker image built: ${{ steps.meta.outputs.tags }}"

  # Deploy using test-flow action
  deploy-to-environment:
    name: Deploy to ${{ inputs.environment || 'dev-int' }}
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: always() && needs.build-docker.result == 'success'
    environment:
      name: ${{ inputs.environment || 'dev-int' }}
    steps:
      - name: Set Release ID
        id: release-id
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "release_id=dev-int-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "release_id=${{ inputs.environment }}-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Environment
        uses: osru-leu/test-flow/.github/actions/deploy-to-release@main
        with:
          release_id: ${{ steps.release-id.outputs.release_id }}
          environment: ${{ inputs.environment || 'dev-int' }}
          duration: 'unlimited'

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application:** Sample Python App" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment || 'dev-int' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release ID:** ${{ steps.release-id.outputs.release_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ needs.build-docker.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

  # Auto-deploy to dev-int on main push
  auto-deploy-notification:
    name: Auto-Deploy Notification
    runs-on: ubuntu-latest
    needs: deploy-to-environment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Notify
        run: |
          echo "✅ Sample Python App auto-deployed to DEV-INT"
          echo "Trigger: Push to main branch"
          echo "Commit: ${{ github.sha }}"

